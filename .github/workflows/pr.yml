name: PR Flow

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows .NET 11 integration tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: codebeltnet/git-checkout@7122f3825d9867b46061afb4bb1de08632dfe561 # v1
        with:
          ref: ${{ github.sha }}
      - name: Install test SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '11.0.100'
      - name: Run regression and integration tests
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/csrun.Tests.ps1 -SdkVersion 11.0.100
      - name: Upload tested script
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: csrun-snapshot-${{ github.run_number }}-${{ github.run_attempt }}
          path: csrun.ps1
          if-no-files-found: error
          retention-days: 30

  compatibility:
    name: Windows .NET 10 compatibility
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: codebeltnet/git-checkout@7122f3825d9867b46061afb4bb1de08632dfe561 # v1
        with:
          ref: ${{ github.sha }}
      - name: Install minimum test SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.115'
      - name: Run .NET 10 compatibility tests
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/csrun.Tests.ps1 -CompatibilityOnly -SdkVersion 10.0.115
