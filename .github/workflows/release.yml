name: Release Flow

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test tagged script
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Validate release version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
              throw 'Release tags must use vMAJOR.MINOR.PATCH, for example v0.1.0.'
          }
      - name: Checkout tagged commit
        uses: codebeltnet/git-checkout@7122f3825d9867b46061afb4bb1de08632dfe561 # v1
        with:
          ref: ${{ github.sha }}
      - name: Install test SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '11.0.100'
      - name: Run regression and integration tests
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/csrun.Tests.ps1
      - name: Upload tested script
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: csrun-${{ github.ref_name }}
          path: csrun.ps1
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create draft release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download tested script
        run: gh run download "$GITHUB_RUN_ID" --name "csrun-$RELEASE_TAG" --dir release
      - name: Create draft with tested standalone asset
        run: gh release create "$RELEASE_TAG" release/csrun.ps1 --verify-tag --draft --generate-notes --title "$RELEASE_TAG"
